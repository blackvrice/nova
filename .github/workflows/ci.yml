name: Rust checks

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: rustfmt --check --edition 2021 crates/nova-cli/runtime/stage_a.rs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace --all-features
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/docs/validate-pack.mjs

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned LLVM 21.1.8
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-21.1.8-win64.exe'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-win64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113') { throw 'LLVM hash mismatch' }
          $installation = Join-Path $env:RUNNER_TEMP 'nova-llvm'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installation") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'LLVM installation failed' }
          "NOVA_CLANG=$installation\bin\clang.exe" >> $env:GITHUB_ENV
      - run: cargo test -p nova-codegen-llvm --test emission -- --ignored --test-threads=1
      - run: cargo test -p nova-cli --test native -- --ignored --test-threads=1
