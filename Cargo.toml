[workspace]
members = ["crates/nova-core-ids", "crates/nova-source", "crates/nova-diagnostics"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
nova-core-ids = { path = "crates/nova-core-ids" }
nova-source = { path = "crates/nova-source" }
