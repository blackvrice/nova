[workspace]
members = [
    "crates/nova-core-ids",
    "crates/nova-source",
    "crates/nova-diagnostics",
    "crates/nova-syntax",
    "crates/nova-lexer",
    "crates/nova-ast",
    "crates/nova-parser",
    "crates/nova-hir",
    "crates/nova-resolve",
    "crates/nova-types",
    "crates/nova-typecheck",
    "crates/nova-mir",
    "crates/nova-codegen",
    "crates/nova-codegen-llvm",
    "crates/nova-cli",
    "crates/nova-driver",
]
resolver = "2"
exclude = ["vendor/unicode-ident-1.0.26"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
nova-driver = { path = "crates/nova-driver" }
nova-core-ids = { path = "crates/nova-core-ids" }
nova-source = { path = "crates/nova-source" }
nova-syntax = { path = "crates/nova-syntax" }
nova-ast = { path = "crates/nova-ast" }
nova-hir = { path = "crates/nova-hir" }
nova-resolve = { path = "crates/nova-resolve" }
nova-types = { path = "crates/nova-types" }
nova-typecheck = { path = "crates/nova-typecheck" }
nova-mir = { path = "crates/nova-mir" }
nova-codegen = { path = "crates/nova-codegen" }
nova-codegen-llvm = { path = "crates/nova-codegen-llvm" }
nova-diagnostics = { path = "crates/nova-diagnostics" }
unicode-ident = { version = "=1.0.26", path = "vendor/unicode-ident-1.0.26" }
